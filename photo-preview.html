<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка портретов экспертов</title><style>*{box-sizing:border-box}body{background:#0b151c;color:#f3f5f6;font:16px/1.5 Arial;margin:0;padding:30px 16px}h1{text-align:center;font-size:clamp(24px,4vw,36px)}p{text-align:center;color:#cbd3d9}.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;max-width:1000px;margin:30px auto}.card{width:min(100%,430px);padding:12px;background:#1a2932;border:1px solid #40515b;border-radius:12px}.photo{width:100%;height:390px;background-repeat:no-repeat;background-size:auto 780px;background-position:left top;border-radius:8px;background-color:#20313a}.kirill{background-image:url('kirill.jpg');background-position:0 0}.egor{background-image:url('egor.jpg');background-position:0 0}h2{font-size:21px;margin:15px 8px 4px}.note{margin:0 8px 16px;color:#c9d1d6;text-align:left}@media(max-width:450px){.photo{height:340px;background-size:auto 680px}}</style><h1>Проверка оригинальных фотографий</h1><p>На этой странице показаны ваши исходные изображения с визиток, без замены лиц. Основной сайт не изменён.</p><div class="grid"><div class="card"><div class="photo kirill"></div><h2>Поляруш Кирилл Витальевич</h2><p class="note">Портрет для согласования</p></div><div class="card"><div class="photo egor"></div><h2>Кондратенков Егор Владимирович</h2><p class="note">Портрет для согласования</p></div></div></html>
